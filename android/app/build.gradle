import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// Единый источник версии — package.json. versionCode = версия × 1000 + номер запуска CI,
// поэтому он только растёт, и новая сборка ставится ПОВЕРХ старой (данные сохраняются).
def appVersion = new JsonSlurper().parse(file('../../package.json')).version
def parts = appVersion.tokenize('.').collect { it.replaceAll('\\D', '').toInteger() }
def semCode = parts[0] * 10000 + (parts.size() > 1 ? parts[1] : 0) * 100 + (parts.size() > 2 ? parts[2] : 0)
// Имя APK = имя проекта + версия: LingvaDesk-1.4.0-debug.apk / LingvaDesk-1.4.0-release.apk
base { archivesName = "LingvaDesk-${appVersion}" }
def runNumber = Math.min((System.getenv("GITHUB_RUN_NUMBER") ?: "0").toInteger(), 999)

android {
    namespace "com.example.lingocards"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        // applicationId НЕ менять: по нему Android находит установленное приложение и обновляет его
        applicationId "com.example.lingocards"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode semCode * 1000 + runNumber
        versionName appVersion
    }
    signingConfigs {
        // Постоянный ключ в репозитории: все сборки CI подписаны одинаково → обновление поверх без удаления.
        debug {
            storeFile file('lingvadesk-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Свой ключ релиза (секреты CI). Если не задан — релиз подписывается постоянным ключом выше.
        release {
            if (System.getenv("KEYSTORE_PATH")) {
                storeFile file(System.getenv("KEYSTORE_PATH"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("KEYSTORE_PATH") ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
}
