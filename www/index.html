<!doctype html>
<html lang="ru" data-theme="light" data-anim="on" data-font="m">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LingvaDesk</title>
<link rel="stylesheet" href="css/style.css">
<script>
  // Страховка: любая ошибка запуска показывается на экране, а не прячется за пустой страницей.
  (function () {
    function show(m) { var a = document.getElementById('app'); if (a) a.textContent = 'Ошибка: ' + m; }
    window.addEventListener('error', function (e) { show(e.message); });
    window.addEventListener('unhandledrejection', function (e) { show((e.reason && e.reason.message) || e.reason); });
  })();
</script>
</head>
<body>
<div id="app">Загрузка…</div>
<div id="toast"></div>
<script type="module" src="js/main.js"
  onerror="document.getElementById('app').textContent='Ошибка: не загрузился js/main.js (проверьте cap sync)'"></script>
</body>
</html>
